name: Scrape Daily Data

on:
  schedule:
    - cron: '0 */12 * * *' # Berjalan setiap 12 jam
  workflow_dispatch:      # Memungkinkan jalankan manual dari tab Actions

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # Penting: memberikan izin untuk commit data balik ke repo

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Scraper Engine
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python engine.py

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add live_data.json
        git commit -m "Automated Data Update: $(date)" || echo "No changes to commit"
        git push
